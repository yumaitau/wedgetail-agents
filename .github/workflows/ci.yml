name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml (with clippy and rustfmt).
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - name: Licences, advisories, bans, sources
        run: cargo deny --locked check

  linux-packages:
    name: linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl C toolchain (for ring)
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - name: Rust toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Static build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check the binary is static
        run: |
          bin=target/${{ matrix.target }}/release/wedgetail-agent
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build .deb and .rpm
        run: |
          cargo deb -p agent-cli --target ${{ matrix.target }} --no-build --no-strip
          cargo generate-rpm -p crates/agent-cli --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          ls -l dist
      - name: Inspect packages
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qpl dist/*.rpm
          rpm -qp --scripts dist/*.rpm
      - name: Install, start, stop and purge the .deb (Ubuntu 24.04 runner)
        run: |
          set -x
          sudo dpkg -i dist/*.deb
          id wedgetail-agent
          id -nG wedgetail-agent | grep -qw adm
          id -nG wedgetail-agent | grep -qw systemd-journal
          test "$(stat -c '%a %U' /var/lib/wedgetail-agent)" = "750 wedgetail-agent"
          test "$(sudo stat -c '%a %U %G' /etc/wedgetail-agent/agent.toml)" = "640 root wedgetail-agent"
          systemd-analyze verify /lib/systemd/system/wedgetail-agent.service
          # Configure a journald rule against a reserved, unresolvable endpoint (not enrolled,
          # so nothing is sent) and check the hardened service runs and reads the journal.
          printf 'endpoint = "https://ingest.example.invalid"\n[[rule]]\nid = "journal"\ntype = "journald"\n' \
            | sudo tee /etc/wedgetail-agent/agent.toml >/dev/null
          sudo wedgetail-agent check-config
          sudo systemctl start wedgetail-agent
          sleep 8
          systemctl is-active wedgetail-agent
          sudo journalctl -u wedgetail-agent --no-pager | tail -n 20
          sudo wedgetail-agent status
          sudo wedgetail-agent status --json | grep -q '"state": "running"'
          sudo test -n "$(sudo ls /var/lib/wedgetail-agent/buffer)"
          sudo systemctl stop wedgetail-agent
          sudo dpkg --purge wedgetail-agent
          if id wedgetail-agent 2>/dev/null; then echo "user not removed"; exit 1; fi
          test ! -e /var/lib/wedgetail-agent
          test ! -e /usr/bin/wedgetail-agent
      - name: Install and erase the .rpm (RHEL 9 UBI container)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" registry.access.redhat.com/ubi9/ubi:latest bash -euxc '
            dnf install -y /dist/*.rpm
            id wedgetail-agent
            test "$(stat -c "%a %U" /var/lib/wedgetail-agent)" = "750 wedgetail-agent"
            wedgetail-agent version
            rpm -e wedgetail-agent
            test ! -e /usr/bin/wedgetail-agent
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  windows-msi:
    name: windows (msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked --release
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/windows/wedgetail-agent.wxs -arch x64 `
            -d Version=0.1.0 -d BinPath=target/release/wedgetail-agent.exe `
            -d ConfigPath=packaging/common/agent.toml -o dist/wedgetail-agent-x86_64.msi
      - name: Install, start, stop and uninstall the service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process msiexec -ArgumentList '/i', 'dist\wedgetail-agent-x86_64.msi', '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          sc.exe qc WedgetailAgent
          icacls "$env:ProgramData\Wedgetail\state"
          $config = "endpoint = `"https://ingest.example.invalid`"`n[[rule]]`nid = `"app`"`ntype = `"wineventlog`"`nchannel = `"Application`"`n"
          Set-Content -Path "$env:ProgramData\Wedgetail\agent.toml" -Value $config -Encoding utf8NoBOM
          & "$env:ProgramFiles\Wedgetail Agent\wedgetail-agent.exe" check-config
          if ($LASTEXITCODE -ne 0) { throw "check-config failed" }
          Start-Service WedgetailAgent
          Start-Sleep -Seconds 8
          $svc = Get-Service WedgetailAgent
          if ($svc.Status -ne 'Running') { Get-Content "$env:ProgramData\Wedgetail\state\agent.log" -ErrorAction SilentlyContinue; throw "service is $($svc.Status)" }
          Get-Content "$env:ProgramData\Wedgetail\state\agent.log"
          & "$env:ProgramFiles\Wedgetail Agent\wedgetail-agent.exe" status
          $status = Get-Content "$env:ProgramData\Wedgetail\state\status.json" -Raw | ConvertFrom-Json
          if ($status.collectors[0].state -ne 'running') { throw "collector is $($status.collectors[0].state): $($status.collectors[0].last_error)" }
          Stop-Service WedgetailAgent
          $p = Start-Process msiexec -ArgumentList '/x', 'dist\wedgetail-agent-x86_64.msi', '/qn', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 50; throw "uninstall failed: $($p.ExitCode)" }
          if (Get-Service WedgetailAgent -ErrorAction SilentlyContinue) { throw "service still installed" }
          if (Test-Path "$env:ProgramFiles\Wedgetail Agent\wedgetail-agent.exe") { throw "binary still installed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi
          path: dist/
          if-no-files-found: error

  macos-pkg:
    name: macos (pkg, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Build the universal pkg
        run: |
          mkdir -p dist
          packaging/macos/build-pkg.sh 0.1.0 \
            target/aarch64-apple-darwin/release/wedgetail-agent \
            target/x86_64-apple-darwin/release/wedgetail-agent \
            dist/wedgetail-agent-universal.pkg
          pkgutil --payload-files dist/wedgetail-agent-universal.pkg
          if pkgutil --payload-files dist/wedgetail-agent-universal.pkg | grep -q '/\._'; then
            echo "AppleDouble files in the payload"; exit 1
          fi
      - name: Install, start, stop and uninstall
        run: |
          set -x
          sudo installer -pkg dist/wedgetail-agent-universal.pkg -target /
          lipo -archs /usr/local/bin/wedgetail-agent
          plutil -lint /Library/LaunchDaemons/au.com.yumait.wedgetail-agent.plist
          printf 'endpoint = "https://ingest.example.invalid"\n[[rule]]\nid = "auth"\ntype = "macos_unified"\npredicate = "process == \\"logger\\""\n' \
            | sudo tee "/Library/Application Support/Wedgetail/agent.toml" >/dev/null
          sudo wedgetail-agent check-config
          sudo launchctl bootstrap system /Library/LaunchDaemons/au.com.yumait.wedgetail-agent.plist
          sleep 8
          sudo launchctl print system/au.com.yumait.wedgetail-agent | grep -E 'state = running'
          sudo cat /Library/Logs/Wedgetail/agent.log
          sudo wedgetail-agent status
          sudo wedgetail-agent status --json | grep -q '"state": "running"'
          sudo packaging/macos/uninstall.sh --purge
          test ! -e /usr/local/bin/wedgetail-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg
          path: dist/
          if-no-files-found: error
