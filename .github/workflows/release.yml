name: Release

# Builds the packages for a `v*` tag, publishes SHA256SUMS and a CycloneDX SBOM, and signs
# every file with Sigstore keyless signing (cosign, GitHub OIDC identity of this workflow).
#
# Optional signing secrets. Steps that need them are skipped when they are not set:
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD   Authenticode (exe and msi)
#   APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD        Developer ID Application + Installer certificates
#   APPLE_APP_IDENTITY, APPLE_INSTALLER_IDENTITY      their keychain identity names
#   APPLE_NOTARY_APPLE_ID, APPLE_NOTARY_TEAM_ID, APPLE_NOTARY_PASSWORD   notarytool
#
# Verify a download:
#   cosign verify-blob --bundle <file>.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/yumaitau/wedgetail-agents/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Tag must match the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo deb -p agent-cli --target "$TARGET" --no-build --no-strip
          cargo generate-rpm -p crates/agent-cli --target "$TARGET"
          mkdir -p dist
          cp target/"$TARGET"/debian/*.deb target/"$TARGET"/generate-rpm/*.rpm dist/
          tar -C target/"$TARGET"/release -czf "dist/wedgetail-agent-$VERSION-$TARGET.tar.gz" wedgetail-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked --release
      - name: Import the Authenticode certificate
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
      - name: Sign the exe and the MSI custom action DLL
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\wedgetail-agent.exe target\release\wedgetail_msi.dll
      - run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/windows/wedgetail-agent.wxs -arch x64 `
            -d Version=$env:VERSION -d BinPath=target/release/wedgetail-agent.exe `
            -d CaPath=target/release/wedgetail_msi.dll -d ConfigPath=packaging/common/agent.toml -o "dist/wedgetail-agent-$env:VERSION-x86_64.msi"
          Compress-Archive -Path target/release/wedgetail-agent.exe -DestinationPath "dist/wedgetail-agent-$env:VERSION-x86_64-pc-windows-msvc.zip"
      - name: Sign the MSI
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\*.msi).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Import the Developer ID certificates
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build the pkg (signed and notarised when the secrets exist)
        run: |
          mkdir -p dist
          packaging/macos/build-pkg.sh "$VERSION" \
            target/aarch64-apple-darwin/release/wedgetail-agent \
            target/x86_64-apple-darwin/release/wedgetail-agent \
            "dist/wedgetail-agent-$VERSION-universal.pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx,cosign
      - name: SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo cyclonedx --format json --all-features
          cp crates/agent-cli/*.cdx.json "dist/wedgetail-agent-$VERSION.cdx.json"
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Sign with Sigstore (keyless)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
