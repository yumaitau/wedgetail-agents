# Preset windows-app-control-allowed (opt-in): AppLocker ALLOWED events, the "allowed" half of
# ISM-1660 (allowed and blocked application control events are centrally logged). High volume:
# one event for every allowed program start, and with DLL rules enforced one for every DLL
# load, so "auto" does not select it. Add it to `presets` where you need that evidence; the
# blocked and audit events are in windows-app-control (on by default).
schema_version = 1

# Executable or DLL allowed to run (8002).
[[rule]]
id = "windows-app-control-allowed.applocker-exe"
type = "wineventlog"
channel = "Microsoft-Windows-AppLocker/EXE and DLL"
event_ids = [8002]

# MSI or script allowed to run (8005).
[[rule]]
id = "windows-app-control-allowed.applocker-script"
type = "wineventlog"
channel = "Microsoft-Windows-AppLocker/MSI and Script"
event_ids = [8005]
