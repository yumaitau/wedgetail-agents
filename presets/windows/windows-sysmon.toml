# Preset windows-sysmon: Sysmon events, selected automatically when the Sysmon channel exists.
# The agent does not install or configure Sysmon; what is logged depends on your Sysmon config.
schema_version = 1

# Process create (1), network connect (3), process end (5), driver load (6), image load (7),
# CreateRemoteThread (8), process access (10), file create (11), registry (12-14), file stream
# (15), pipes (17-18), DNS (22), file delete (23), process tampering (25), file delete logged
# (26).
[[rule]]
id = "windows-sysmon.events"
type = "wineventlog"
channel = "Microsoft-Windows-Sysmon/Operational"
event_ids = [1, 3, 5, 6, 7, 8, 10, 11, 12, 13, 14, 15, 17, 18, 22, 23, 25, 26]
