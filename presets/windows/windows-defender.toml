# Preset windows-defender: Microsoft Defender Antivirus detections and tampering, selected
# automatically when the Defender channel exists.
schema_version = 1

# Malware detected and actions (1006-1008, 1015, 1116-1119), real-time protection disabled
# (5001), real-time protection configuration changed (5004), configuration changed (5007),
# scanning for malware and spyware disabled (5010, 5012).
[[rule]]
id = "windows-defender.operational"
type = "wineventlog"
channel = "Microsoft-Windows-Windows Defender/Operational"
event_ids = [1006, 1007, 1008, 1015, 1116, 1117, 1118, 1119, 5001, 5004, 5007, 5010, 5012]
